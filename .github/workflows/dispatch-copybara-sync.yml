name: Dispatch Copybara sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dispatch-copybara-sync
  cancel-in-progress: false

jobs:
  dispatch:
    if: vars.REHEARSAL_ENABLE_COPYBARA == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create RepoOps Dispatch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.REPO_OPS_DISPATCH_APP_ID }}
          private-key: ${{ secrets.REPO_OPS_DISPATCH_PRIVATE_KEY }}
          owner: carderne-org
          permission-contents: write

      - name: Dispatch the private sync worker
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PUBLIC_SHA: ${{ github.sha }}
          MONO_REPOSITORY: ${{ secrets.COPYBARA_MONO_REPOSITORY }}
        run: |
          set -euo pipefail
          [[ "$MONO_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          gh api "repos/${MONO_REPOSITORY}/dispatches" \
            --method POST \
            --field event_type=copybara-public-push \
            --field "client_payload[public_sha]=$PUBLIC_SHA"
