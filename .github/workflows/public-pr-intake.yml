name: Accept public PR for mono review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open, ready-for-review public pull request to accept
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  inspect:
    if: github.repository == 'carderne-org/exp-super-mirror'
    runs-on: ubuntu-latest
    outputs:
      payload: ${{ steps.validate.outputs.payload }}
    steps:
      - name: Validate the accepted PR snapshot
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] && (( PR_NUMBER > 0 ))

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e \
            '.state == "open" and .base.ref == "main" and .draft == false and
             (.base.sha | test("^[0-9a-f]{40}$")) and
             (.head.sha | test("^[0-9a-f]{40}$")) and
             (.head.repo.full_name | test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"))' \
            <<<"$pr_json" >/dev/null

          accepted_base="$(jq -r '.base.sha' <<<"$pr_json")"
          accepted_head="$(jq -r '.head.sha' <<<"$pr_json")"
          accepted_head_repository="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          raw_title="$(jq -r '.title' <<<"$pr_json")"
          approved_title="$(
            RAW_TITLE="$raw_title" python3 -c '
          import os, unicodedata
          value = " ".join(os.environ["RAW_TITLE"].split())
          if not value or len(value) > 256:
              raise SystemExit("public PR title must contain 1 to 256 normalized characters")
          if any(unicodedata.category(character).startswith("C") for character in value):
              raise SystemExit("public PR title contains a control or format character")
          print(value)
          '
          )"

          git init public
          git -C public remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C public fetch --no-tags origin \
            "refs/heads/main:refs/remotes/public-main" \
            "refs/pull/${PR_NUMBER}/head:refs/remotes/pr-head"
          fetched_base="$(git -C public rev-parse refs/remotes/public-main)"
          fetched_head="$(git -C public rev-parse refs/remotes/pr-head)"
          test "$fetched_base" = "$accepted_base"
          test "$fetched_head" = "$accepted_head"

          parent_tree="$(git -C public rev-parse "${accepted_base}^{tree}")"
          result_tree="$(git -C public merge-tree --write-tree "$accepted_base" "$accepted_head")"
          [[ "$parent_tree" =~ ^[0-9a-f]{40}$ ]]
          [[ "$result_tree" =~ ^[0-9a-f]{40}$ ]]
          candidate_digest="$(
            printf 'public-pr-candidate-v1\n%s\n%s\n' "$parent_tree" "$result_tree" | sha256sum | cut -d' ' -f1
          )"
          [[ "$candidate_digest" =~ ^[0-9a-f]{64}$ ]]

          payload="$(jq -cn \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg number "$PR_NUMBER" \
            --arg base_sha "$accepted_base" \
            --arg accepted_head_sha "$accepted_head" \
            --arg head_repository "$accepted_head_repository" \
            --arg approved_title "$approved_title" \
            --arg parent_tree "$parent_tree" \
            --arg result_tree "$result_tree" \
            --arg candidate_digest "$candidate_digest" \
            '{repository:$repository, number:($number|tonumber), base_sha:$base_sha, accepted_head_sha:$accepted_head_sha, head_repository:$head_repository, approved_title:$approved_title, parent_tree:$parent_tree, result_tree:$result_tree, candidate_digest:$candidate_digest}')"
          echo "payload=$payload" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: inspect
    if: github.repository == 'carderne-org/exp-super-mirror' && vars.REHEARSAL_ENABLE_PUBLIC_PR_FLOW == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create publication App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PUBLICATION_APP_ID }}
          private-key: ${{ secrets.PUBLICATION_APP_PRIVATE_KEY }}
          owner: carderne-org
          repositories: ${{ vars.MONO_REPOSITORIES }}
          permission-contents: write

      - name: Dispatch the immutable PR snapshot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MONO_REPOSITORY: ${{ vars.MONO_REPOSITORY }}
          PAYLOAD: ${{ needs.inspect.outputs.payload }}
        run: |
          set -euo pipefail
          [[ "$MONO_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          jq -n --argjson client_payload "$PAYLOAD" \
            '{event_type:"public-pr", client_payload:$client_payload}' > dispatch.json
          gh api "repos/${MONO_REPOSITORY}/dispatches" \
            --method POST --input dispatch.json
