name: Publish exact candidate

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Public candidate ref containing the prevalidated commit
        required: true
        type: string
      expected_sha:
        description: Expected public commit SHA
        required: true
        type: string
      expected_base_sha:
        description: Public main SHA that the candidate must directly follow
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'carderne-org/exp-super-mirror' && vars.REHEARSAL_ENABLE_PUBLIC_SYNC == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Validate publication inputs
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REF" =~ ^rehearsal/[A-Za-z0-9._/-]+$ ]]
          [[ "$CANDIDATE_REF" != *..* ]]
          [[ "$CANDIDATE_REF" != *//* ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Create publication App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PUBLICATION_APP_ID }}
          private-key: ${{ secrets.PUBLICATION_APP_PRIVATE_KEY }}
          owner: carderne-org
          repositories: exp-super-mirror
          permission-contents: write
          permission-workflows: write

      - name: Publish the exact candidate
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${APP_TOKEN}@github.com/carderne-org/exp-super-mirror.git"
          git fetch --no-tags origin "refs/heads/${CANDIDATE_REF}:refs/remotes/candidate"
          candidate_sha="$(git rev-parse refs/remotes/candidate)"
          test "$candidate_sha" = "$EXPECTED_SHA"
          candidate_parent="$(git rev-list --parents -n 1 "$candidate_sha" | cut -d' ' -f2)"
          test "$candidate_parent" = "$EXPECTED_BASE_SHA"
          git fetch --no-tags origin refs/heads/main:refs/remotes/main
          main_sha="$(git rev-parse refs/remotes/main)"
          test "$main_sha" = "$EXPECTED_BASE_SHA"
          git push origin "$candidate_sha:refs/heads/main"
          echo "Published $candidate_sha to main."

      - name: Clean up the exact candidate ref
        if: always() && steps.app-token.outcome == 'success'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REF" =~ ^rehearsal/[A-Za-z0-9._/-]+$ ]]
          [[ "$CANDIDATE_REF" != *..* ]]
          [[ "$CANDIDATE_REF" != *//* ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init cleanup
          git -C cleanup remote add origin \
            "https://x-access-token:${APP_TOKEN}@github.com/carderne-org/exp-super-mirror.git"
          remote_candidate="$(git -C cleanup ls-remote --refs origin "refs/heads/$CANDIDATE_REF" | cut -f1)"
          if [[ -z "$remote_candidate" ]]; then
            echo "Candidate ref $CANDIDATE_REF is already absent."
          elif [[ "$remote_candidate" == "$EXPECTED_SHA" ]]; then
            git -C cleanup push origin ":refs/heads/$CANDIDATE_REF"
          else
            echo "Candidate ref $CANDIDATE_REF moved to $remote_candidate; leaving it in place." >&2
            exit 1
          fi
